<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Configurable eagerness demo placeholder</title>
  <desc id="description">A neutral static placeholder for a future comparison of low, medium, and high eagerness. No demo media is included.</desc>
  <rect width="1200" height="400" fill="#f3f4f6"/>
  <rect x="24" y="24" width="1152" height="352" rx="16" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#374151">
    <text x="600" y="135" font-size="36" font-weight="bold">Demo placeholder</text>
    <text x="600" y="205" font-size="28">Low | Medium | High</text>
    <text x="600" y="275" font-size="22">Demo media intentionally omitted.</text>
  </g>
</svg>
