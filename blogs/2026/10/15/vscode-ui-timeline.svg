<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title description">
  <title id="title">VS Code interface timeline from 2015 to 2026</title>
  <desc id="description">Major interface milestones include the first preview, editor tabs, modern color themes, and the modernized UI preview.</desc>
  <rect width="1600" height="420" rx="24" fill="#181818"/>
  <line x1="160" y1="190" x2="1440" y2="190" stroke="#5f5f5f" stroke-width="4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(160 0)">
      <circle cx="0" cy="190" r="16" fill="#0078d4"/>
      <text x="0" y="120" fill="#4daafc" font-size="38" font-weight="600">2015</text>
      <text x="0" y="255" fill="#f0f0f0" font-size="28" font-weight="600">First preview</text>
      <text x="0" y="295" fill="#cccccc" font-size="22">The early editor shell</text>
    </g>

    <g transform="translate(585 0)">
      <circle cx="0" cy="190" r="16" fill="#0078d4"/>
      <text x="0" y="120" fill="#4daafc" font-size="38" font-weight="600">2016</text>
      <text x="0" y="255" fill="#f0f0f0" font-size="28" font-weight="600">Editor tabs</text>
      <text x="0" y="295" fill="#cccccc" font-size="22">A new way to navigate files</text>
    </g>

    <g transform="translate(1015 0)">
      <circle cx="0" cy="190" r="16" fill="#0078d4"/>
      <text x="0" y="120" fill="#4daafc" font-size="38" font-weight="600">2023</text>
      <text x="0" y="255" fill="#f0f0f0" font-size="28" font-weight="600">Modern themes</text>
      <text x="0" y="295" fill="#cccccc" font-size="22">New light and dark defaults</text>
    </g>

    <g transform="translate(1440 0)">
      <circle cx="0" cy="190" r="16" fill="#0078d4"/>
      <text x="0" y="120" fill="#4daafc" font-size="38" font-weight="600">2026</text>
      <text x="0" y="255" fill="#f0f0f0" font-size="28" font-weight="600">Modernized UI preview</text>
      <text x="0" y="295" fill="#cccccc" font-size="22">A shared design system</text>
    </g>
  </g>
</svg>
