<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title description">
  <title id="title">Connect to the host that runs the session</title>
  <desc id="description">The desktop Agents Window on your computer connects to an Agent Host on the same machine or a connected SSH, Tunnel, or WSL host. The Agent Host runs directly on that host or inside its Dev Container and owns the session. The browser-based Agents Window on any device connects through a dev tunnel to an Agent Host on your development machine. Dev Container sessions require the desktop client. These are connection options, not different session types.</desc>
  <rect width="800" height="700" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1e1e1e">
    <text x="400" y="44" font-size="28">Connect to the host that runs the session</text>
    <text x="400" y="76" font-size="17" fill="#475569">The client and host can be on the same machine or different devices.</text>
    <text x="124" y="118" font-size="20">Where you interact</text>
    <text x="578" y="118" font-size="20">Where the session runs</text>

    <rect x="22" y="192" width="204" height="130" rx="12" fill="#eff6ff" stroke="#4a9eed" stroke-width="2"/>
    <text x="124" y="226" font-size="22" fill="#1e40af">Desktop client</text>
    <text x="124" y="256" font-size="20">Agents Window</text>
    <text x="124" y="287" font-size="17" fill="#475569">Your computer</text>
    <text x="300" y="209" font-size="17" fill="#475569">Local, SSH,</text>
    <text x="300" y="231" font-size="17" fill="#475569">Tunnel, or WSL</text>
    <path d="M238 259 H366 M359 253 L366 259 L359 265" fill="none" stroke="#1e40af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="378" y="143" width="400" height="280" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="578" y="177" font-size="22">Workspace host</text>
    <text x="578" y="204" font-size="16" fill="#475569">Same machine or a connected host</text>
    <rect x="396" y="239" width="156" height="160" rx="10" fill="#eff6ff" stroke="#4a9eed" stroke-width="2"/>
    <text x="474" y="267" font-size="19" fill="#1e40af">On the host</text>
    <text x="474" y="311" font-size="20">Agent Host</text>
    <text x="474" y="343" font-size="17" fill="#475569">Session</text>
    <text x="474" y="372" font-size="16" fill="#475569">Workspace tools</text>
    <text x="576" y="326" font-size="17" fill="#475569">or</text>
    <rect x="600" y="239" width="158" height="160" rx="10" fill="#e5dbff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="679" y="267" font-size="19" fill="#5b21b6">Dev Container*</text>
    <text x="679" y="311" font-size="20">Agent Host</text>
    <text x="679" y="343" font-size="17" fill="#475569">Session</text>
    <text x="679" y="372" font-size="16" fill="#475569">Workspace tools</text>

    <rect x="22" y="490" width="204" height="130" rx="12" fill="#eff6ff" stroke="#4a9eed" stroke-width="2"/>
    <text x="124" y="524" font-size="22" fill="#1e40af">Browser client</text>
    <text x="124" y="554" font-size="18">Agents Window web</text>
    <text x="124" y="585" font-size="17" fill="#475569">Any device</text>
    <text x="300" y="531" font-size="17" fill="#475569">Dev tunnel</text>
    <path d="M238 552 H366 M359 546 L366 552 L359 558" fill="none" stroke="#1e40af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="378" y="465" width="400" height="174" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="578" y="498" font-size="22">Development machine</text>
    <rect x="396" y="521" width="364" height="94" rx="10" fill="#eff6ff" stroke="#4a9eed" stroke-width="2"/>
    <text x="578" y="553" font-size="20">Agent Host</text>
    <text x="578" y="584" font-size="17" fill="#475569">Session + workspace tools</text>

    <text x="22" y="675" font-size="16" text-anchor="start" fill="#475569">* Dev Container sessions require the desktop client.</text>
  </g>
</svg>
