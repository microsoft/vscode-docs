<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1035" viewBox="0 0 1440 1035" role="img" aria-labelledby="title description">
<title id="title">Customization sources for two projects and a remotely connected client</title>
<desc id="description">An office workstation runs a Copilot frontend session and a Claude API session. Per-harness user instructions and an installed organization review skill are available to both. Each workspace has its own instructions and skill. The selected frontend session also receives supported user guidance and an issue lookup tool from an Agents window on a travel laptop. Dashed boundaries show execution and client locations, folder panels show workspaces, dark labels identify harnesses, and small badges identify customization scope.</desc>
